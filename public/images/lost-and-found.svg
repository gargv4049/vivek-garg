  <text x="270" y="138" font-family="'Inter', sans-serif" font-size="12" fill="#666666">Real-time status updates across campus departments</text>

  <!-- Card 1: AirPods Pro (Matched Item) -->
  <g transform="translate(270, 160)">
    <rect width="310" height="240" rx="4" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <!-- Card header -->
    <rect x="0" y="0" width="310" height="90" fill="#F7F7F5"/>
    <rect x="12" y="12" width="70" height="22" rx="3" fill="#171717"/>
    <text x="47" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">FOUND</text>
    <rect x="195" y="12" width="102" height="22" rx="3" fill="#FFFFFF" stroke="#171717" stroke-width="1"/>
    <text x="246" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#171717" text-anchor="middle">94% MATCH SCORE</text>
    
    <!-- Item visual wireframe -->
    <circle cx="155" cy="52" r="22" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <path d="M148 46 C148 43, 162 43, 162 46 L160 58 C160 60, 150 60, 150 58 Z" fill="#171717"/>

    <!-- Content -->
    <text x="16" y="118" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#171717">Apple AirPods Pro (2nd Gen)</text>
    <text x="16" y="138" font-family="'Inter', sans-serif" font-size="11" fill="#666666">White MagSafe Case with engraving 'VK'</text>
    <text x="16" y="156" font-family="'Inter', sans-serif" font-size="11" fill="#858585">Location: Central Library 2nd Floor Desk 4</text>
    <line x1="16" y1="172" x2="294" y2="172" stroke="#E5E5E5" stroke-width="1"/>
    <text x="16" y="196" font-family="'Inter', sans-serif" font-size="10" fill="#858585">Reported 2h ago by Dept Proctor</text>
    
    <rect x="196" y="184" width="100" height="28" rx="3" fill="#171717"/>
    <text x="246" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Verify Claim</text>
  </g>

  <!-- Card 2: Student College ID -->
  <g transform="translate(605, 160)">
    <rect width="310" height="240" rx="4" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="90" fill="#F7F7F5"/>
    <rect x="12" y="12" width="60" height="22" rx="3" fill="#858585"/>
    <text x="42" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">LOST</text>
    <rect x="220" y="12" width="78" height="22" rx="3" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <text x="259" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#666666" text-anchor="middle">ACTIVE LISTING</text>
    
