  <rect x="56" y="380" width="62" height="4" rx="2" fill="#171717"/>

  <text x="56" y="406" font-family="'Inter', sans-serif" font-size="11" fill="#171717">Haversine GPS: 30%</text>
  <rect x="56" y="414" width="156" height="4" rx="2" fill="#E5E5E5"/>
  <rect x="56" y="414" width="46" height="4" rx="2" fill="#171717"/>

  <text x="56" y="440" font-family="'Inter', sans-serif" font-size="11" fill="#171717">Temporal &amp; Cat: 30%</text>
  <rect x="56" y="448" width="156" height="4" rx="2" fill="#E5E5E5"/>
  <rect x="56" y="448" width="46" height="4" rx="2" fill="#171717"/>

