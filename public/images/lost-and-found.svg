      <rect x="0" y="26" width="36" height="38" rx="3" fill="#FAFAFA" stroke="#171717" stroke-width="1.5"/>
      <text x="18" y="52" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#171717" text-anchor="middle">7</text>
      
      <rect x="44" y="26" width="36" height="38" rx="3" fill="#FAFAFA" stroke="#171717" stroke-width="1.5"/>
      <text x="62" y="52" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#171717" text-anchor="middle">4</text>
      
      <rect x="88" y="26" width="36" height="38" rx="3" fill="#FAFAFA" stroke="#171717" stroke-width="1.5"/>
      <text x="106" y="52" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#171717" text-anchor="middle">9</text>
      
      <rect x="132" y="26" width="36" height="38" rx="3" fill="#FAFAFA" stroke="#171717" stroke-width="1.5"/>
      <text x="150" y="52" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#171717" text-anchor="middle">2</text>
      
      <rect x="176" y="26" width="36" height="38" rx="3" fill="#FAFAFA" stroke="#171717" stroke-width="1.5"/>
      <text x="194" y="52" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#171717" text-anchor="middle">0</text>
      
      <rect x="220" y="26" width="36" height="38" rx="3" fill="#FAFAFA" stroke="#171717" stroke-width="1.5"/>
      <text x="238" y="52" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#171717" text-anchor="middle">8</text>
    </g>

    <!-- QR Code Graphic Placeholder -->
    <g transform="translate(320, 52)">
      <rect width="60" height="60" rx="3" fill="#FFFFFF" stroke="#171717" stroke-width="1.5"/>
      <!-- QR Pattern -->
      <rect x="6" y="6" width="16" height="16" fill="#171717"/>
      <rect x="8" y="8" width="12" height="12" fill="#FFFFFF"/>
      <rect x="10" y="10" width="8" height="8" fill="#171717"/>
      
      <rect x="38" y="6" width="16" height="16" fill="#171717"/>
      <rect x="40" y="8" width="12" height="12" fill="#FFFFFF"/>
      <rect x="42" y="10" width="8" height="8" fill="#171717"/>

      <rect x="6" y="38" width="16" height="16" fill="#171717"/>
      <rect x="8" y="40" width="12" height="12" fill="#FFFFFF"/>
      <rect x="10" y="42" width="8" height="8" fill="#171717"/>

      <rect x="26" y="26" width="8" height="8" fill="#171717"/>
      <rect x="38" y="38" width="6" height="6" fill="#171717"/>
      <rect x="46" y="46" width="6" height="6" fill="#171717"/>
    </g>

    <!-- Info text -->
    <g transform="translate(400, 58)">
      <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#171717">Atomic Handover Status: VERIFIED</text>
      <text x="0" y="32" font-family="'Inter', sans-serif" font-size="10" fill="#666666">Item status will transition atomically inside PostgreSQL transaction.</text>
      <text x="0" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#858585">PDF handover voucher generated via Apache PDFBox.</text>
    </g>
  </g>
