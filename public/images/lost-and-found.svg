    <circle cx="145" cy="46" r="6" fill="#858585"/>
    <line x1="156" y1="44" x2="172" y2="44" stroke="#858585" stroke-width="2"/>
    <line x1="156" y1="50" x2="168" y2="50" stroke="#E5E5E5" stroke-width="2"/>

    <!-- Content -->
    <text x="16" y="118" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#171717">Student College ID Card</text>
    <text x="16" y="138" font-family="'Inter', sans-serif" font-size="11" fill="#666666">CSE Dept, Blue lanyard with badge clip</text>
    <text x="16" y="156" font-family="'Inter', sans-serif" font-size="11" fill="#858585">Location: Cafeteria Seating Area</text>
    <line x1="16" y1="172" x2="294" y2="172" stroke="#E5E5E5" stroke-width="1"/>
    <text x="16" y="196" font-family="'Inter', sans-serif" font-size="10" fill="#858585">Reported yesterday</text>
    
    <rect x="210" y="184" width="86" height="28" rx="3" fill="#FFFFFF" stroke="#171717" stroke-width="1"/>
    <text x="253" y="202" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#171717" text-anchor="middle">View Details</text>
  </g>

  <!-- Bottom Verification Panel (Two-Factor Handover) -->
  <g transform="translate(270, 420)">
    <rect width="645" height="136" rx="4" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <rect x="0" y="0" width="645" height="36" fill="#F7F7F5"/>
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#171717" letter-spacing="0.5">TWO-FACTOR CLAIM HANDOVER PROTOCOL (TRANSACTION SECURED)</text>
    
