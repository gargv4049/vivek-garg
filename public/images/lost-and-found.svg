<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none">
  <!-- Background -->
  <rect width="960" height="600" fill="#F7F7F5"/>
  <rect x="24" y="24" width="912" height="552" rx="4" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>

  <!-- Top App Navigation Bar -->
  <rect x="24" y="24" width="912" height="56" fill="#FFFFFF"/>
  <line x1="24" y1="80" x2="936" y2="80" stroke="#E5E5E5" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="52" cy="52" r="5" fill="#E5E5E5"/>
  <circle cx="68" cy="52" r="5" fill="#E5E5E5"/>
  <circle cx="84" cy="52" r="5" fill="#E5E5E5"/>

  <!-- App Title & Breadcrumb -->
  <text x="110" y="56" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#171717">CAMPUS LOST &amp; FOUND</text>
  <rect x="280" y="42" width="60" height="20" rx="3" fill="#F7F7F5" stroke="#E5E5E5" stroke-width="1"/>
  <text x="310" y="56" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#666666" text-anchor="middle">v2.4.0</text>
  
  <!-- Top Nav Links -->
  <text x="660" y="56" font-family="'Inter', sans-serif" font-size="12" fill="#666666">Feed</text>
  <text x="710" y="56" font-family="'Inter', sans-serif" font-size="12" fill="#171717" font-weight="600">Matches (3)</text>
  <text x="800" y="56" font-family="'Inter', sans-serif" font-size="12" fill="#666666">Handover OTP</text>
  <rect x="880" y="38" width="40" height="28" rx="3" fill="#171717"/>
  <text x="900" y="56" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">ADMIN</text>

  <!-- Left Sidebar / Stats -->
  <rect x="24" y="80" width="220" height="496" fill="#FAFAFA"/>
  <line x1="244" y1="80" x2="244" y2="576" stroke="#E5E5E5" stroke-width="1"/>
  
  <text x="44" y="116" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#858585" letter-spacing="1">DISCOVERY FILTERS</text>
  
  <!-- Categories -->
  <rect x="44" y="132" width="180" height="32" rx="3" fill="#171717"/>
  <text x="56" y="153" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">All Categories</text>
  <text x="210" y="153" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="end">48</text>

  <rect x="44" y="172" width="180" height="32" rx="3" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="56" y="193" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#171717">Electronics</text>
  <text x="210" y="193" font-family="'Inter', sans-serif" font-size="11" fill="#858585" text-anchor="end">16</text>

  <rect x="44" y="212" width="180" height="32" rx="3" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="56" y="233" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#171717">Student IDs &amp; Cards</text>
  <text x="210" y="233" font-family="'Inter', sans-serif" font-size="11" fill="#858585" text-anchor="end">14</text>

  <rect x="44" y="252" width="180" height="32" rx="3" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="56" y="273" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#171717">Keys &amp; Wallets</text>
  <text x="210" y="273" font-family="'Inter', sans-serif" font-size="11" fill="#858585" text-anchor="end">12</text>

