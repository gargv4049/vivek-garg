    <!-- Row 3 -->
    <rect y="132" width="872" height="48" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <text x="16" y="162" font-family="'Inter', sans-serif" font-size="11" fill="#666666">978-0132350884</text>
    <text x="140" y="162" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#171717">Clean Code: A Handbook of Agile</text>
    <text x="440" y="162" font-family="'Inter', sans-serif" font-size="11" fill="#666666">Robert C. Martin</text>
    <text x="640" y="162" font-family="'Inter', sans-serif" font-size="11" fill="#858585">0 / 4</text>
    <rect x="760" y="148" width="70" height="20" rx="3" fill="#171717"/>
