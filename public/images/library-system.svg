    <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#171717">[2026-10-23 14:22:10] ISSUE_TX: Book ID #4092 checked out to Enrollment #24E1ARCSM40P186 (Return Due: 2026-11-06)</text>
    <text x="16" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#666666">[2026-10-23 13:05:42] RETURN_TX: Book ID #1028 returned. Condition verified, inventory restored (+1).</text>
    <text x="16" y="106" font-family="'JetBrains Mono', monospace" font-size="11" fill="#666666">[2026-10-23 11:40:15] CATALOG_SYNC: Synchronized 142 total volumes against local storage file.</text>
    <text x="16" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#858585">[2026-10-23 09:00:00] INITIALIZATION: System booted on JDK 25 runtime environment.</text>
