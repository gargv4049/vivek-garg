  <circle cx="78" cy="48" r="4" fill="#FFFFFF" fill-opacity="0.3"/>
  <text x="100" y="52" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">LIBRARY MANAGEMENT SYSTEM (JAVA SWING / OOP ARCHITECTURE)</text>

  <!-- Subheader Toolbar -->
  <rect x="24" y="72" width="912" height="48" fill="#FAFAFA"/>
  <line x1="24" y1="120" x2="936" y2="120" stroke="#E5E5E5" stroke-width="1"/>
  
  <rect x="44" y="82" width="100" height="28" rx="3" fill="#171717"/>
  <text x="94" y="100" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add Book</text>

  <rect x="154" y="82" width="110" height="28" rx="3" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
