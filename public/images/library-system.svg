    <text x="16" y="114" font-family="'Inter', sans-serif" font-size="11" fill="#666666">978-0262033848</text>
    <text x="140" y="114" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#171717">Introduction to Algorithms (CLRS)</text>
    <text x="440" y="114" font-family="'Inter', sans-serif" font-size="11" fill="#666666">Cormen, Leiserson, Rivest</text>
    <text x="640" y="114" font-family="'Inter', sans-serif" font-size="11" fill="#171717">2 / 8</text>
