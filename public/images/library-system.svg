    <text x="760" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#171717">STATUS</text>

    <!-- Row 1 -->
    <rect y="36" width="872" height="48" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <text x="16" y="66" font-family="'Inter', sans-serif" font-size="11" fill="#666666">978-0134685991</text>
    <text x="140" y="66" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#171717">Effective Java (3rd Edition)</text>
    <text x="440" y="66" font-family="'Inter', sans-serif" font-size="11" fill="#666666">Joshua Bloch</text>
    <text x="640" y="66" font-family="'Inter', sans-serif" font-size="11" fill="#171717">4 / 5</text>
    <rect x="760" y="52" width="70" height="20" rx="3" fill="#F7F7F5" stroke="#E5E5E5" stroke-width="1"/>
