    <text x="16" y="210" font-family="'Inter', sans-serif" font-size="11" fill="#666666">978-1118063330</text>
    <text x="140" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#171717">Operating System Concepts (10th Ed)</text>
    <text x="440" y="210" font-family="'Inter', sans-serif" font-size="11" fill="#666666">Silberschatz, Galvin, Gagne</text>
    <text x="640" y="210" font-family="'Inter', sans-serif" font-size="11" fill="#171717">5 / 6</text>
    <rect x="760" y="196" width="70" height="20" rx="3" fill="#F7F7F5" stroke="#E5E5E5" stroke-width="1"/>
